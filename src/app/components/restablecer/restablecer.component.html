<div class="narrow-page"><div class="eyebrow">RECUPERACIÓN DE ACCESO</div><h1>Crea tu nueva contraseña</h1><div class="panel panel-pad"><ng-container *ngIf="token; else sinToken"><form [formGroup]="form" (ngSubmit)="restablecer()" novalidate><div class="field"><label for="rs-nueva">Nueva contraseña</label><div class="input-action"><input id="rs-nueva" [type]="visible?'text':'password'" autocomplete="new-password" formControlName="nueva"><button type="button" (click)="visible=!visible" [attr.aria-label]="visible?'Ocultar contraseña':'Mostrar contraseña'">{{visible?'OCULTAR':'MOSTRAR'}}</button></div><small>Mínimo 10 caracteres con mayúscula, minúscula y número.</small><span class="error" *ngIf="validar(form,'nueva')">{{validar(form,'nueva')}}</span></div><div class="field"><label for="rs-confirm">Confirmar nueva contraseña</label><input id="rs-confirm" [type]="visible?'text':'password'" autocomplete="new-password" formControlName="confirmar"><span class="error" *ngIf="validar(form,'confirmar')">{{validar(form,'confirmar')}}</span></div><div class="form-error" *ngIf="error" role="alert">{{error}} <a routerLink="/recuperar">Solicitar un enlace nuevo</a></div><div class="form-actions"><button class="btn btn-primary" type="submit" [disabled]="cargando">{{cargando?'Guardando...':'Guardar contraseña'}}</button><a class="btn btn-outline" routerLink="/acceso">Cancelar</a></div></form></ng-container><ng-template #sinToken><div class="form-error" role="alert">Este enlace no es válido. Solicita uno nuevo para restablecer tu contraseña.</div><div class="form-actions"><a class="btn btn-primary" routerLink="/recuperar">Solicitar enlace</a></div></ng-template></div></div>
